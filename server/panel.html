<!DOCTYPE html>
<html lang="es-419">
	<head>
		<meta charset="UTF-8">
		<meta name="robots" content="noindex, nofollow">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<title>Panel del Sistema de Acceso</title>
		<style>
			.card-image {
			display: block;
			max-width: 350px;
			width: 100%;
			height: auto;
			margin-inline: auto;
			}
		</style>
	</head>
	<body class="bg-dark text-light">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
		<div class="container mt-3">
			<h1 class="text-center mb-4">Panel del Sistema de Acceso v0.09</h1>
			<h2 id="labelMessage">Conectando al servidor...</h2> 
			<div class="card mx-auto" style="width: 30rem;" id="usercard">
				<img src="https://monsterballgo.com/media/usr/default.png" class="mt-5 card-image" id="pfp" alt="...">
				<div class="card-body text-center my-5">
					<h1 class="card-title text-danger d-none" id="bannedTitle">NO AUTORIZO</h1>
					<h1 class="card-title text-primary-emphasis">#<span id="userid">99999</span></h1>
					<h2 class="card-subtitle text-primary-emphasis my-3">
						<span id="firstname" >Nombre</span>
						<span id="lastname" >Apellido</span>
					</h2>
					<h2 class="card-subtitle text-primary-emphasis  my-3">Alias: <span id="username">username</span></h2>
					<h5 class="card-subtitle text-primary-emphasis  my-3">Contacto: <span id="email">0</span></h2>
				</div>
			</div>
		</div>
		<script>
			let connected=false;
			const labelMessage = document.getElementById("labelMessage");
			const usercard = document.getElementById("usercard");
			const bannedTitle = document.getElementById("bannedTitle");
			function paintUserCard(status){
				if( status === 'active' ){
					usercard.classList.add("bg-success-subtle");
					usercard.classList.remove("bg-danger-subtle");
					bannedTitle.classList.add("d-none");
				}
				else if( status === 'inactive' ){
					bannedTitle.classList.add("d-none");
					usercard.classList.add("bg-danger-subtle");
					usercard.classList.remove("bg-success-subtle");
				}
				else if ( status === 'banned' ){
					bannedTitle.classList.remove("d-none");
					usercard.classList.add("bg-danger-subtle");
					usercard.classList.remove("bg-success-subtle");
				}
                else if( status === 'unknown')
                {
					bannedTitle.classList.remove("d-none");
					usercard.classList.add("bg-danger-subtle");
					usercard.classList.remove("bg-success-subtle");
                    
                }
				else 
				{
					bannedTitle.classList.add("d-none");
					usercard.classList.remove("bg-danger-subtle");
					usercard.classList.remove("bg-success-subtle");
				}
			}
			try{
				//labelMessage.style.display = "none";
				usercard.style.display = "none";
				const ws = new WebSocket("wss://monsterballgo.com/app-access/ws");
				ws.onopen = (event) => {
					connected=true;
					labelMessage.style.display = "block";
					usercard.style.display = "none";
					labelMessage.innerText="Conectado. Esperando a que alguien solicite acceso..."
				}
				ws.onmessage = (event) => {
					//Debe llegar un json con los datos del usuario, similar a cuando hace login
					console.log('Mensaje recibido del servidor: ', event.data);
					usercard.style.display = "block";
					labelMessage.style.display = "none";
					const data = JSON.parse(event.data);
					document.getElementById("userid").textContent = data.id?data.id:"XXXXX";
					document.getElementById("firstname").textContent = data.first_name?data.first_name:"Desconocido";
					document.getElementById("lastname").textContent = data.last_name?data.last_name:"";
					document.getElementById("username").textContent = data.username?data.username:"desconocido";
					document.getElementById("email").textContent = data.email?data.email:"no email";
					document.getElementById("pfp").src = data.pfp_url?data.pfp_url:"https://monsterballgo.com/media/usr/default.png";
					paintUserCard(data.status);
				}
				
				ws.onclose = (event) => {
					labelMessage.style.display = "block";
					usercard.style.display = "none";
					labelMessage.classList.add("text-danger");
					labelMessage.replaceChildren(
						document.createTextNode("Error: "),
						document.createElement("br"),
						document.createTextNode( connected ? "Se perdió la conexión con el servidor." : "No se pudo conectar al servidor."),
						document.createElement("br"),
						document.createTextNode("Recarga la página para intentar nuevamente."),	
					)
				}
				ws.onerror = (event) => {
					labelMessage.style.display = "block";
					usercard.style.display = "none";
					labelMessage.classList.add("text-danger");
					labelMessage.replaceChildren(
						document.createTextNode("Error: "),
						document.createElement("br"),
						document.createTextNode(event.message),
						document.createElement("br"),
						document.createTextNode("Recarga la página para intentar nuevamente."),	
					)
				}
			}
			catch(e){
				labelMessage.style.display = "block";
				usercard.style.display = "none";
				labelMessage.classList.add("text-danger");
				labelMessage.replaceChildren(
					document.createTextNode("Error: "),
					document.createElement("br"),
					document.createTextNode(e.message),
					document.createElement("br"),
					document.createTextNode("Recarga la página para intentar nuevamente."),	
				)
				
			}
		</script>
	</body>
</html>
